name: Build Ikemen GO (R36S / Debian 13 Trixie arm64)

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]

jobs:
  build:
    # Runner arm64 nativo (sin emulación QEMU)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      # Evita "error obtaining VCS status: exit status 128" dentro del contenedor
      GOFLAGS: -buildvcs=false
    container:
      image: debian:trixie

    steps:
      - name: Instalar dependencias
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl wget unzip tar xz-utils \
            make cmake pkg-config gcc g++ \
            libsdl2-dev libasound2-dev libegl1-mesa-dev libgles2-mesa-dev

      - uses: actions/checkout@v4

      - name: Marcar el repo como seguro para git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Instalar Go (la versión que pide go.mod)
        run: |
          GOVER="$(grep -E '^go [0-9]' go.mod | awk '{print $2}')"
          echo "Go requerido: $GOVER"
          curl -fsSL "https://go.dev/dl/go${GOVER}.linux-arm64.tar.gz" -o /tmp/go.tgz
          tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Compilar y ensamblar deploy/
        run: |
          go version
          make install

      - name: Incluir SDL2 y script de arranque (sin apt en la consola)
        run: |
          ldd deploy/Ikemen_GO.arm64 || true
          mkdir -p deploy/lib
          cp -L /usr/lib/aarch64-linux-gnu/libSDL2-2.0.so.0 deploy/lib/
          cat > deploy/ikemen.sh <<'EOF'
          #!/bin/sh
          cd "$(dirname "$0")"
          export LD_LIBRARY_PATH="$PWD/lib:$LD_LIBRARY_PATH"
          export SDL_VIDEODRIVER="${SDL_VIDEODRIVER:-kmsdrm}"
          exec ./Ikemen_GO.arm64 "$@"
          EOF
          sed -i 's/^          //' deploy/ikemen.sh
          chmod +x deploy/ikemen.sh deploy/Ikemen_GO.arm64

      - name: Empaquetar
        run: |
          mkdir -p dist
          tar -C deploy -czf dist/ikemen-go-r36s-arm64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: ikemen-go-r36s-arm64
          path: dist/ikemen-go-r36s-arm64.tar.gz
