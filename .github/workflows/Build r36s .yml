name: Build Ikemen GO (R36S / Debian 13 Trixie arm64)

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]

jobs:
  build:
    # Runner arm64 nativo (sin emulación QEMU)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      # Evita "error obtaining VCS status: exit status 128" dentro del contenedor
      GOFLAGS: -buildvcs=false
    container:
      image: debian:trixie

    steps:
      - name: Instalar dependencias
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl wget unzip zip tar xz-utils \
            make cmake pkg-config gcc g++ \
            libsdl2-dev libasound2-dev libegl1-mesa-dev libgles2-mesa-dev

      - uses: actions/checkout@v4

      - name: Marcar el repo como seguro para git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Instalar Go (la versión que pide go.mod)
        run: |
          GOVER="$(grep -E '^go [0-9]' go.mod | awk '{print $2}')"
          echo "Go requerido: $GOVER"
          curl -fsSL "https://go.dev/dl/go${GOVER}.linux-arm64.tar.gz" -o /tmp/go.tgz
          tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Compilar y ensamblar deploy/
        run: |
          go version
          make install

      - name: Script de arranque (usa la SDL2 del sistema)
        run: |
          ldd deploy/Ikemen_GO.arm64 || true
          mkdir -p deploy/lib
          # No se incluye libSDL2: la de Trixie exige un libgbm mas nuevo que el de la consola
          cat > deploy/ikemen.sh <<'EOF'
          #!/bin/sh
          cd "$(dirname "$0")"
          export LD_LIBRARY_PATH="$PWD/lib:$LD_LIBRARY_PATH"
          export SDL_VIDEODRIVER="${SDL_VIDEODRIVER:-kmsdrm}"
          exec ./Ikemen_GO.arm64 "$@"
          EOF
          sed -i 's/^          //' deploy/ikemen.sh
          chmod +x deploy/ikemen.sh deploy/Ikemen_GO.arm64

      - name: Empaquetar (tar.gz y layout PortMaster)
        run: |
          mkdir -p dist
          tar -C deploy -czf dist/ikemen-go-r36s-arm64.tar.gz .
          # Layout PortMaster: "Ikemen GO.sh" + carpeta ikemen/
          mkdir -p dist/pm/ikemen
          cp -r deploy/. dist/pm/ikemen/
          cp "portmaster/Ikemen GO.sh" dist/pm/
          cp portmaster/port.json dist/pm/ikemen/
          chmod +x "dist/pm/Ikemen GO.sh" dist/pm/ikemen/Ikemen_GO.arm64
          (cd dist/pm && zip -r -q ../ikemen-go-portmaster.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: ikemen-go-r36s-arm64
          path: |
            dist/ikemen-go-r36s-arm64.tar.gz
            dist/ikemen-go-portmaster.zip
